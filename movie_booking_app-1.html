<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Booking App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f4f4f4;color:#222}
header{background:#e51b23;color:white;padding:18px;text-align:center}
header h1{margin-bottom:5px}
.container{width:92%;max-width:900px;margin:25px auto}
.card{background:white;padding:20px;margin-bottom:20px;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.1)}
h2{margin-bottom:15px}
.movies{display:flex;gap:15px;flex-wrap:wrap}
.movie{flex:1;min-width:180px;padding:20px;background:#fff0f1;border:2px solid transparent;border-radius:10px;cursor:pointer;text-align:center}
.movie:hover,.movie.selected{border-color:#e51b23}
.movie.selected{background:#ffe0e2}
.movie h3{margin-bottom:8px}
.times{display:flex;gap:10px;flex-wrap:wrap}
.time{padding:10px 18px;border:1px solid #e51b23;color:#e51b23;border-radius:6px;cursor:pointer}
.time.selected{background:#e51b23;color:white}
.screen{text-align:center;background:#333;color:white;padding:8px;margin:15px auto 25px;max-width:400px;border-radius:50%}
.seats{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;max-width:500px;margin:auto}
.seat{padding:9px 3px;background:#ddd;border-radius:5px;text-align:center;cursor:pointer;font-size:13px}
.seat.selected{background:#e51b23;color:white}
.seat.booked{background:#555;color:white;cursor:not-allowed}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:6px}
button{background:#e51b23;color:white;border:none;padding:13px 25px;border-radius:7px;cursor:pointer;font-size:16px}
button:hover{background:#c9141b}
#total{font-size:20px;font-weight:bold;margin:15px 0}
#confirmation{display:none;text-align:center}
.success{color:green;font-size:28px;margin-bottom:15px}
.booking-info{line-height:1.8;margin:20px 0}
@media(max-width:600px){
.seats{grid-template-columns:repeat(8,1fr);gap:5px}
.seat{font-size:10px;padding:7px 2px}
}
</style>
</head>
<body>
<header>
<h1>🎬 MovieBook</h1>
<p>Book your movie tickets</p>
</header>

<div class="container">
<div class="card">
<h2>🎥 Select Movie</h2>
<div class="movies">
<div class="movie" onclick="selectMovie(this,'Avengers: Endgame')"><h3>Avengers</h3><p>Action | 2h 58m</p></div>
<div class="movie" onclick="selectMovie(this,'Leo')"><h3>Leo</h3><p>Action | 2h 44m</p></div>
<div class="movie" onclick="selectMovie(this,'Pushpa 2')"><h3>Pushpa 2</h3><p>Action | 3h 20m</p></div>
</div>
</div>

<div class="card">
<h2>🕐 Select Show Time</h2>
<div class="times">
<div class="time" onclick="selectTime(this,'10:00 AM')">10:00 AM</div>
<div class="time" onclick="selectTime(this,'1:30 PM')">1:30 PM</div>
<div class="time" onclick="selectTime(this,'5:00 PM')">5:00 PM</div>
<div class="time" onclick="selectTime(this,'8:30 PM')">8:30 PM</div>
</div>
</div>

<div class="card">
<h2>💺 Select Seats</h2>
<div class="screen">SCREEN</div>
<div class="seats" id="seats"></div>
<div id="total">Total: ₹0</div>
</div>

<div class="card">
<h2>👤 Customer Details</h2>
<input type="text" id="name" placeholder="Enter your name">
<input type="email" id="email" placeholder="Enter your email">
<button onclick="confirmBooking()">🎟️ Confirm Booking</button>
</div>

<div class="card" id="confirmation">
<div class="success">✅ Booking Successful!</div>
<div class="booking-info" id="bookingInfo"></div>
<button onclick="closeBookingWindow()">Close Window</button>
</div>
</div>

<script>
let selectedMovie="";
let selectedTime="";
let selectedSeats=[];
const ticketPrice=150;

const seatsContainer=document.getElementById("seats");

for(let i=1;i<=40;i++){
    const seat=document.createElement("div");
    seat.classList.add("seat");
    seat.innerText=i;

    if([3,8,15,22,31].includes(i)){
        seat.classList.add("booked");
    }else{
        seat.addEventListener("click",function(){
            selectSeat(seat,i);
        });
    }
    seatsContainer.appendChild(seat);
}

function selectMovie(element,movie){
    document.querySelectorAll(".movie").forEach(m=>m.classList.remove("selected"));
    element.classList.add("selected");
    selectedMovie=movie;
}

function selectTime(element,time){
    document.querySelectorAll(".time").forEach(t=>t.classList.remove("selected"));
    element.classList.add("selected");
    selectedTime=time;
}

function selectSeat(element,seatNumber){
    element.classList.toggle("selected");

    if(selectedSeats.includes(seatNumber)){
        selectedSeats=selectedSeats.filter(s=>s!==seatNumber);
    }else{
        selectedSeats.push(seatNumber);
    }
    updateTotal();
}

function updateTotal(){
    const total=selectedSeats.length*ticketPrice;
    document.getElementById("total").innerText="Total: ₹"+total;
}

function confirmBooking(){
    const name=document.getElementById("name").value.trim();
    const email=document.getElementById("email").value.trim();

    if(selectedMovie===""){alert("Please select a movie.");return}
    if(selectedTime===""){alert("Please select a show time.");return}
    if(selectedSeats.length===0){alert("Please select at least one seat.");return}
    if(name===""||email===""){alert("Please enter your name and email.");return}

    const bookingId="MB"+Math.floor(100000+Math.random()*900000);
    const total=selectedSeats.length*ticketPrice;

    document.getElementById("bookingInfo").innerHTML=`
        <p><strong>Booking ID:</strong> ${bookingId}</p>
        <p><strong>Name:</strong> ${name}</p>
        <p><strong>Movie:</strong> ${selectedMovie}</p>
        <p><strong>Show Time:</strong> ${selectedTime}</p>
        <p><strong>Seats:</strong> ${selectedSeats.join(", ")}</p>
        <p><strong>Total Amount:</strong> ₹${total}</p>
        <p>Enjoy your movie! 🍿</p>
    `;

    document.getElementById("confirmation").style.display="block";
    document.getElementById("confirmation").scrollIntoView({behavior:"smooth"});
}

function closeBookingWindow(){
    window.close();
    setTimeout(function(){
        alert("Booking completed successfully. You can now close this browser tab.");
    },300);
}
</script>
</body>
</html>
